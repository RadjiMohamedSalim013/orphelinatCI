# Déploiement Render (offre gratuite) — voir docs/DEPLOIEMENT.md
services:
  - type: web
    name: orphamap-ci
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      # Fournies par Aiven (voir la documentation) : non stockées dans le dépôt
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_PEM
        sync: false
      # Adresse publique, ex. https://orphamap-ci.onrender.com
      - key: DEFAULT_URI
        sync: false
      # Disque éphémère sur l'offre gratuite : copie des photos dans la base
      - key: FICHIERS_EN_BASE
        value: "1"
      - key: TRUSTED_PROXIES
        value: "REMOTE_ADDR"
      - key: MAILER_DSN
        value: "null://null"
      # Premier administrateur créé au démarrage ; supprimer ADMIN_PASSWORD ensuite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Adresse secrète de la page de connexion (ex. /espace-7f3k9q2m) : à choisir
      # soi-même et à ne communiquer qu'à l'équipe. /admin renvoie 404 aux visiteurs.
      - key: ADMIN_LOGIN_PATH
        sync: false
