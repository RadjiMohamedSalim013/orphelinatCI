# Configuration Apache de l'image OrphaMap CI
ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# Transmet à PHP les variables d'environnement définies sur l'hébergeur
# (sans quoi les valeurs par défaut du fichier .env l'emporteraient).
PassEnv APP_ENV APP_SECRET DATABASE_URL DATABASE_SSL_CA DEFAULT_URI MAILER_DSN MAILER_FROM
PassEnv FICHIERS_EN_BASE MAP_TILE_URL MAP_ATTRIBUTION TRUSTED_PROXIES

# Journaux sur la sortie standard (visibles dans le tableau de bord de l'hébergeur)
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
