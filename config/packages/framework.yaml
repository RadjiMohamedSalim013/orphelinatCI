# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Cookie de session : HTTPS uniquement quand le site est en HTTPS, illisible par
    # JavaScript, non envoyé par les formulaires d'autres sites ; session abandonnée
    # après 2 h d'inactivité.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        gc_maxlifetime: 7200

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Hébergeurs derrière un proxy (Render…) : HTTPS et IP réelle du visiteur
        # (URL absolues correctes, limitation des envois par IP).
        trusted_proxies: '%env(default:trusted_proxies_defaut:TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
