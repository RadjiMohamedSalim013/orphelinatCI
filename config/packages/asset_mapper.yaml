framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Pas de polyfill es-module-shims chargé depuis un CDN tiers : les cartes
        # d'import sont reconnues par tous les navigateurs actuels (Safari 16.4+).
        importmap_polyfill: false

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
