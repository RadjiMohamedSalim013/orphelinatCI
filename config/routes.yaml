# Contrôleurs publics (le dossier Admin est importé séparément avec son préfixe)
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    exclude: '../src/Controller/Admin/'

admin_controllers:
    resource:
        path: ../src/Controller/Admin/
        namespace: App\Controller\Admin
    type: attribute
    prefix: /admin
    trailing_slash_on_root: false
